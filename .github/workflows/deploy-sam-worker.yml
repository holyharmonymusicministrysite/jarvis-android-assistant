name: Deploy SAM operator API
on:
  push:
    branches: [main]
    paths:
      - "sam-worker/**"
      - ".github/workflows/deploy-sam-worker.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: "sam-worker"
          command: deploy