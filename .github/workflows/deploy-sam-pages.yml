name: Deploy SAM website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "sam-web/**"
      - ".github/workflows/deploy-sam-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "sam-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./sam-web"
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
